# Build the site and publish it to GitHub Pages.
# Runs on every push to main, once a day (to pick up new episodes from the
# RSS feed), and by hand from the Actions tab.
name: Deploy

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 9 * * *"
  workflow_dispatch:

permissions:
  contents: read

# One deploy at a time; a newer run waits rather than cancelling one mid-way.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # Refresh public/flts-search.json from the FaceLikeTheSun RSS feed and
  # commit it back to main when it changed, so new videos stay in search
  # after they leave the 15-item feed. No API key. Fail-soft if the feed
  # is down. GITHUB_TOKEN pushes do not retrigger this workflow; this run
  # still builds and deploys the updated file via the artifact below.
  update-flts:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # prepare-content fetches episode feeds (needed to prune duplicates),
      # then runs the RSS update. The script itself is fail-soft on feed errors.
      - run: node scripts/prepare-content.ts
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: flts-search
          path: public/flts-search.json
          if-no-files-found: error
      - name: Commit FaceLikeTheSun catalog if it changed
        run: |
          set -eu
          git add public/flts-search.json
          if git diff --cached --quiet; then
            echo "FaceLikeTheSun catalog unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update FaceLikeTheSun search catalog from the channel RSS feed."
          git fetch origin main
          if ! git pull --rebase origin main; then
            git rebase --abort || true
            echo "::warning::Could not rebase the FaceLikeTheSun catalog commit; deploying this run's update without pushing."
            exit 0
          fi
          if git push origin HEAD:main; then
            exit 0
          fi
          git fetch origin main
          if git pull --rebase origin main && git push origin HEAD:main; then
            exit 0
          fi
          git rebase --abort || true
          echo "::warning::Could not push the FaceLikeTheSun catalog update; deploying this run's update without pushing."

  build:
    needs: update-flts
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: flts-search
          path: public
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Lint + type check, unit tests, then the build, which ends with the
      # no-index, third-party, leak and link checks over dist/.
      - run: pnpm gate
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
        with:
          # Pages file sync has been slow (~10m+); default 600s aborts mid-sync.
          timeout: "1200000"
